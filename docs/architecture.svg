<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Curio architecture</title>
  <desc>Streamlit UI and API clients call a FastAPI service. A shared agent engine plans, calls policy-gated tools from per-domain toolkits, asks for human approval before state changes, and verifies answers against tool evidence. Each domain toolkit is backed by its own recommenders and data. A cross-domain pairing links Books to Cocktails: it pours drinks for a book or a reading list.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a7f72"/>
    </marker>
    <style>
      .card { fill: #ffffff; stroke: #d9d1c4; stroke-width: 1.2; }
      .accent { fill: #f6ece6; stroke: #9c4935; stroke-width: 1.4; }
      .muted { fill: #f3f1ec; stroke: #d9d1c4; stroke-width: 1; }
      .h { font-size: 17px; font-weight: 700; fill: #2b2a27; }
      .h2 { font-size: 14px; font-weight: 700; fill: #2b2a27; }
      .t { font-size: 12.5px; fill: #4a4741; }
      .s { font-size: 11.5px; fill: #6f6a61; }
      .tag { font-size: 11px; font-weight: 600; fill: #9c4935; letter-spacing: .08em; }
      .pill { fill: #9c4935; }
      .pilltext { font-size: 11.5px; font-weight: 600; fill: #ffffff; }
      .line { stroke: #8a7f72; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="700" rx="18" fill="#faf8f4"/>
  <text x="40" y="48" font-family="Georgia, serif" font-size="30" fill="#2b2a27">Curio</text>
  <text x="122" y="47" class="tag">ARCHITECTURE</text>
  <text x="40" y="74" class="s">One agent engine, many recommendation domains. Each answer is planned, acted on through gated tools, approved by a human when it changes state, and verified.</text>

  <!-- Clients -->
  <rect x="40" y="104" width="230" height="250" rx="12" class="card"/>
  <text x="58" y="132" class="tag">CLIENTS</text>
  <text x="58" y="158" class="h2">Streamlit UI</text>
  <text x="58" y="180" class="t">Domain switch</text>
  <text x="58" y="199" class="t">Live step trace</text>
  <text x="58" y="218" class="t">Approval cards (approve,</text>
  <text x="58" y="235" class="t">narrow, decline)</text>
  <text x="58" y="254" class="t">Shortlist, memory, compare</text>
  <text x="58" y="290" class="h2">Any HTTP client</text>
  <text x="58" y="312" class="t">REST + NDJSON streaming</text>
  <text x="58" y="331" class="t">OpenAPI at /docs</text>

  <!-- API -->
  <rect x="300" y="104" width="216" height="250" rx="12" class="card"/>
  <text x="316" y="132" class="tag">FASTAPI</text>
  <text x="316" y="160" class="t">/chat, /chat/stream</text>
  <text x="316" y="180" class="t">/chat/feedback</text>
  <text x="316" y="200" class="t">/search/text, /search/image</text>
  <text x="316" y="220" class="t">/users/{id}/recommendations</text>
  <text x="316" y="240" class="t">/products/{id}/related</text>
  <text x="316" y="260" class="t">/cocktails/*, /books/*</text>
  <text x="316" y="280" class="t">/domains, /health</text>
  <text x="316" y="314" class="s">Stateless: shortlist and</text>
  <text x="316" y="331" class="s">memory live on the client</text>

  <!-- Engine -->
  <rect x="540" y="104" width="380" height="250" rx="12" class="accent"/>
  <text x="558" y="132" class="tag">SHARED AGENT ENGINE</text>
  <rect x="558" y="146" width="104" height="30" rx="15" class="pill"/>
  <text x="610" y="166" text-anchor="middle" class="pilltext">1 · Plan</text>
  <rect x="678" y="146" width="104" height="30" rx="15" class="pill"/>
  <text x="730" y="166" text-anchor="middle" class="pilltext">2 · Act</text>
  <rect x="798" y="146" width="104" height="30" rx="15" class="pill"/>
  <text x="850" y="166" text-anchor="middle" class="pilltext">3 · Verify</text>
  <text x="558" y="202" class="h2">Policy-gated tools</text>
  <text x="558" y="222" class="t">READ runs directly · ASK pauses with quick replies</text>
  <text x="558" y="240" class="t">APPROVE only proposes: HMAC-signed, expiring,</text>
  <text x="558" y="258" class="t">narrow-only, bound to tool and domain</text>
  <text x="558" y="288" class="h2">Grounding guardrail</text>
  <text x="558" y="308" class="t">Prices, IDs, names and amounts checked against tool</text>
  <text x="558" y="326" class="t">evidence; one self-correction, then catalog facts</text>
  <text x="558" y="344" class="s">Budgets: 5 tool calls, 90 s per turn · every step streamed</text>

  <!-- LLM -->
  <rect x="960" y="104" width="200" height="110" rx="12" class="card"/>
  <text x="978" y="132" class="tag">LLM</text>
  <text x="978" y="158" class="h2">Any LangChain provider</text>
  <text x="978" y="180" class="t">OpenAI-compatible gateways</text>
  <text x="978" y="198" class="t">Anthropic, Ollama</text>
  <rect x="960" y="234" width="200" height="120" rx="12" class="muted"/>
  <text x="978" y="262" class="tag">QUALITY LOOP</text>
  <text x="978" y="286" class="t">Answer feedback</text>
  <text x="978" y="305" class="t">Offline evaluation, MAP@12</text>
  <text x="978" y="324" class="t">Real-data browser E2E</text>
  <text x="978" y="343" class="s">CI on every push</text>

  <!-- Arrows top row -->
  <path d="M270 229 H296" class="line" marker-end="url(#arrow)"/>
  <path d="M516 229 H536" class="line" marker-end="url(#arrow)"/>
  <path d="M920 160 H956" class="line" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <path d="M730 354 V392" class="line" marker-end="url(#arrow)"/>

  <!-- Domain toolkits -->
  <text x="40" y="414" class="tag">DOMAIN TOOLKITS AND RECOMMENDERS</text>
  <rect x="40" y="428" width="360" height="200" rx="12" class="card"/>
  <text x="58" y="456" class="h">Fashion</text>
  <text x="58" y="478" class="s">14,300 H&amp;M products · 5,000 customers</text>
  <text x="58" y="504" class="t">Tools: search, inspect, related pieces,</text>
  <text x="58" y="522" class="t">personal picks, outfit builder, shortlist, memory</text>
  <text x="58" y="550" class="t">CLIP text + photo search in Qdrant</text>
  <text x="58" y="568" class="t">Collaborative, co-purchase graph, buy-again</text>
  <text x="58" y="586" class="t">Learned ranker with past-only features</text>
  <text x="58" y="610" class="s">Evaluated on a chronological holdout</text>

  <rect x="420" y="428" width="360" height="200" rx="12" class="card"/>
  <text x="438" y="456" class="h">Cocktails</text>
  <text x="438" y="478" class="s">425 TheCocktailDB recipes · offline</text>
  <text x="438" y="504" class="t">Tools: search, inspect, similar drinks,</text>
  <text x="438" y="522" class="t">"What can I make?", save, remember tastes</text>
  <text x="438" y="550" class="t">TF-IDF search with flavour words</text>
  <text x="438" y="568" class="t">Ingredient-family similarity</text>
  <text x="438" y="586" class="t">Pantry coverage with missing items</text>
  <text x="438" y="610" class="s">Alcohol-free and avoided-ingredient filters</text>

  <rect x="800" y="428" width="360" height="200" rx="12" class="card"/>
  <text x="818" y="456" class="h">Books</text>
  <text x="818" y="478" class="s">goodbooks-10k · 10,000 books with reader ratings</text>
  <text x="818" y="504" class="t">Tools: search, inspect, readers also liked,</text>
  <text x="818" y="522" class="t">more by author, pair a drink, reading list, tastes</text>
  <text x="818" y="550" class="t">TF-IDF over titles, authors and tags</text>
  <text x="818" y="568" class="t">Item-item collaborative filtering</text>
  <text x="818" y="586" class="t">from reader ratings</text>
  <text x="818" y="610" class="s">New domain = one toolkit, no engine changes</text>

  <!-- Cross-domain link: Books → Cocktails pairing -->
  <path d="M980 628 V658 H600 V628" class="line" marker-end="url(#arrow)"/>
  <rect x="675" y="645" width="230" height="26" rx="13" class="pill"/>
  <text x="790" y="662" text-anchor="middle" class="pilltext">Pairing · book → cocktail, explained</text>
</svg>
