name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"   # same uv as the Dockerfile's 0.11 image; uv.lock is written by it
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Pinned, checksum-verified public CSV (~400 KB). With it, the probes on the real cocktail
      # catalog in tests/cocktails/test_cocktail_release_fixes.py run instead of skipping.
      - run: uv run python -m scripts.prepare_cocktails
      # Runs every test under tests/ offline (fake encoder, in-memory Qdrant, scripted LLM,
      # small cocktail fixtures). No secrets or downloaded data are needed.
      - run: uv run pytest
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
