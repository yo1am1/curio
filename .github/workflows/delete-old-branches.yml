name: Delete old branches

# One-off clean-up requested by the repository owner: removes branches superseded by the v1.x
# releases on main. This workflow file is deleted again in the next commit.
on:
  push:
    branches: [main]
    paths: [.github/workflows/delete-old-branches.yml]

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for branch in release/fashion-mvp release/v1.0 archive/main-pre-v1 feat/v1.1 \
                        feat/image-search-and-evaluation next/curio-multidomain; do
            if gh api "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" --silent 2>/dev/null; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
              echo "deleted ${branch}"
            else
              echo "${branch} is already gone"
            fi
          done
          gh api "repos/${GITHUB_REPOSITORY}/branches" --jq '.[].name'
