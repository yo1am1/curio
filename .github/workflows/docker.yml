name: Docker image

# Builds and smoke-tests the image on pull requests that can change it, so a Dockerfile,
# dependency or base-image bump is proven before merge (the Release workflow only builds
# after merge, on main).
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - web/package.json
      - web/package-lock.json
      - .github/workflows/docker.yml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space for the PyTorch layer
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build
        run: docker build -t curio:ci .
      - name: Smoke test
        run: |
          docker run --rm curio:ci python -c "import curio.app.api, curio.domains.pairings; print('ok')"
          docker run --rm curio:ci test -s web/dist/index.html
