name: Docker image

# Builds and smoke-tests the image on pull requests that can change it, so a Dockerfile,
# dependency or base-image bump is proven before merge (the Release workflow only builds
# after merge, on main).
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - web/package.json
      - web/package-lock.json
      - .github/workflows/docker.yml
      - .github/scripts/smoke-image.sh
      - src/curio/app/healthcheck.py

permissions: {}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space for the PyTorch layer
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build
        run: docker build -t curio:ci .
      - name: Smoke test
        run: .github/scripts/smoke-image.sh curio:ci
