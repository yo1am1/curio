name: Release

# Runs after CI passes on main. When pyproject.toml carries a version without a release yet, it
# tags that exact commit, publishes the GitHub release (notes = the matching CHANGELOG.md
# section), then deploys the Docker image to ghcr.io through the `release` environment.
# Re-runs are safe: a version that is already released is skipped.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Create the release if this version is new
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' \
            CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section; add it before releasing."
            exit 1
          fi
          gh release create "$tag" --target "$sha" --title "Curio $version" --notes-file notes.md
          echo "created=true" >> "$GITHUB_OUTPUT"

  image:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/pkgs/container/curio
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/curio
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.sha }}
      - name: Free disk space for the PyTorch layer
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build
        run: |
          docker build \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.revision="${{ needs.release.outputs.sha }}" \
            --label org.opencontainers.image.licenses="Apache-2.0" \
            --label org.opencontainers.image.description="Curio: one tool-using AI agent, three recommendation domains" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
      - name: Smoke test
        run: |
          docker run --rm "$IMAGE:$VERSION" python -c "import clothes_recommender.api, clothes_recommender.pairings; print('ok')"
      - name: Push to ghcr.io
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
