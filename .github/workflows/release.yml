name: Release

# Runs after CI passes on a push to main (or by hand). When pyproject.toml carries a version
# without a published release, three jobs run in order:
#
#   1. plan:    reads the version, checks that CHANGELOG.md has its section, and works out
#               whether the image and the release still need to be made.
#   2. image:   builds the Docker image of that exact commit, smoke-tests it (the API must
#               report healthy), and pushes it to ghcr.io through the `release` environment.
#   3. publish: once the image is on ghcr.io, tags the commit and publishes the GitHub release
#               (notes = the matching CHANGELOG.md section).
#
# So a release never points at an image that does not exist: a failed build or smoke test
# stops before the release is created. Every step is idempotent: an image already on ghcr.io
# is not rebuilt, a published release is kept, and any later run (the next green push to main
# or a manual dispatch) finishes whatever an earlier run left undone. An image already on
# ghcr.io must have been built from this run's commit (its revision label), or the run fails:
# the release tag never points at a commit other than the image's. `latest` is pushed in its
# own step, so a failed push is retried by the next run.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      released: ${{ steps.plan.outputs.released }}
      latest: ${{ steps.plan.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Read the version and check its changelog section
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # `gh release view` sees published releases with a read-only token.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already released"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' \
            CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section; add it before releasing."
            exit 1
          fi
          # `latest` moves only to the highest released version, never back to an older line.
          # A failed listing fails the run: assuming no releases would move `latest` back.
          if ! releases=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts \
            --json tagName --jq '.[].tagName'); then
            echo "::error::Could not list the published releases; not deciding on latest."
            exit 1
          fi
          highest=$(printf '%s\n%s\n' "$releases" "$tag" | sed '/^$/d; s/^v//' | sort -V | tail -1)
          if [ "$highest" = "$version" ]; then latest=true; else latest=false; fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

  image:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/pkgs/container/curio
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/curio
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
      LATEST: ${{ needs.plan.outputs.latest }}
    steps:
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Skip if this version is already published (from this commit)
        id: published
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            # The image must come from this run's commit, or the release would tag another.
            revision=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Image}}' \
              | jq -r 'if has("config") then . else ([.[]][0]) end
                       | .config.Labels["org.opencontainers.image.revision"] // ""')
            if [ "$revision" != "$SHA" ]; then
              echo "::error::$IMAGE:$VERSION was built from '${revision:-an unknown commit}', not $SHA. Bump the version, or release from that commit."
              exit 1
            fi
            echo "$IMAGE:$VERSION is already published from $SHA"
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.published.outputs.done == 'false'
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Free disk space for the PyTorch layer
        if: steps.published.outputs.done == 'false'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build
        if: steps.published.outputs.done == 'false'
        run: |
          docker build \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.revision="$SHA" \
            --label org.opencontainers.image.licenses="Apache-2.0" \
            --label org.opencontainers.image.description="Curio: one tool-using AI agent, three recommendation domains" \
            -t "$IMAGE:$VERSION" .
      - name: Smoke test
        if: steps.published.outputs.done == 'false'
        run: .github/scripts/smoke-image.sh "$IMAGE:$VERSION"
      - name: Push to ghcr.io
        if: steps.published.outputs.done == 'false'
        run: docker push "$IMAGE:$VERSION"
      - name: Point latest at this version
        # Runs whether or not the image was built in this run, so a failed push of `latest`
        # is retried by the next run.
        if: env.LATEST == 'true'
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"

  publish:
    needs: [plan, image]
    if: needs.plan.outputs.released == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      packages: read
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/curio
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: The image must be on ghcr.io before the release exists
        env:
          TOKEN: ${{ github.token }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker manifest inspect "$IMAGE:$VERSION" >/dev/null
      - name: Tag the commit and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$draft" = false ]; then
            echo "$tag is already released"
            exit 0
          fi
          if [ "$draft" = true ]; then
            gh release edit "$tag" --draft=false --target "$SHA"
            exit 0
          fi
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' \
            CHANGELOG.md > notes.md
          gh release create "$tag" --target "$SHA" --title "Curio $VERSION" --notes-file notes.md
