name: PR title

# The PR title becomes the squash commit on main, so it must be a Conventional Commit.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|ci|build|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].{2,}$'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title must look like 'type(scope): summary', e.g. 'fix(books): …'."
            echo "Allowed types: feat fix perf refactor docs test ci build chore revert. Got: $TITLE"
            exit 1
          fi
