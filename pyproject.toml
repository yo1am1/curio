[project]
name = "curio-recommendations"
version = "3.0.0"
description = "Curio: an engine for trustworthy, tool-using recommendation agents, with three deliberately different reference domains (fashion, cocktails, books)."
keywords = ["recommendations", "agent", "llm", "grounding", "human-in-the-loop", "fashion", "cocktails", "books", "clip", "qdrant", "fastapi", "react"]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Yehor Trepalin" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langchain>=1.4.5",
    "langchain-core>=1.6.10",
    "langchain-openai>=1.7.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "scipy>=1.18.1",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.19.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
anthropic = [
    "langchain-anthropic>=1.7.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curio"]

# CPU-only torch wheels on Linux keep the install (and Docker image) small.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not integration and not e2e'"
markers = [
    "integration: needs downloaded models or network",
    "e2e: browser end-to-end run over prepared data (uv run pytest -m e2e tests/e2e)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[dependency-groups]
dev = [
    "playwright>=1.64.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
