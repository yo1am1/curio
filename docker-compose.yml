# Curio runs in one of two stacks; start one at a time (both publish port 8000). One container
# serves the API and the React app on that port: open http://localhost:8000.
#
# Ports are published on 127.0.0.1 only: the API has no login and its chat spends your LLM
# key. To serve your network on purpose, set CURIO_HOST (shell or .env) to the address to
# publish on and ALLOWED_HOSTS to the names browsers will use, for example
#   CURIO_HOST=0.0.0.0 ALLOWED_HOSTS=localhost,127.0.0.1,curio.lan docker compose --profile demo up
# and read SECURITY.md first. Qdrant is never published; the API reaches it on the compose network.
#
#   docker compose --profile demo up --build      # quick start: cocktails, books and Plan my
#                                                 # evening, no H&M download (~150 MB books)
#   DEMO_BOOKS=0 docker compose --profile demo up --build   # ... cocktails only
#   docker compose --profile fashion up --build   # full stack: fashion (+ cocktails if prepared)
#
# Optional: add `--profile ollama` to the demo for a local LLM (see docs/technical-guide.md).

x-curio: &curio
  image: curio:local   # one image for every service, built once
  env_file: [{ path: .env, required: false }]

services:
  # --- Quick start (profile: demo) ---------------------------------------------------------
  # Recipes and books live in the `demo-data` volume, so nothing is written to ./data and no
  # host permissions are involved. The first run downloads the pinned ~260 KB recipe file and
  # prepares goodbooks-10k once (~150 MB download, under a minute, about 1 GB of RAM), so the
  # demo has book pairings and Plan my evening; DEMO_BOOKS=0 (shell or .env) skips the books.
  demo-data:
    <<: *curio
    build: .
    profiles: [demo]
    volumes: [demo-data:/app/data]
    environment:
      DEMO_BOOKS: ${DEMO_BOOKS:-1}
    command:
      - sh
      - -c
      - |
        set -e
        test -s data/cocktails.parquet || python -m scripts.prepare_cocktails
        if [ "$$DEMO_BOOKS" = 1 ] && ! test -s data/book_neighbours.parquet; then
          python -m scripts.prepare_books
        fi

  # The API and the app (web/dist in the image) on http://localhost:8000.
  demo-api:
    <<: *curio
    profiles: [demo]
    environment:
      # Never loads CLIP or Qdrant, even with fashion data around; books only once prepared.
      ENABLED_DOMAINS: cocktails,books
      # The Host names the API answers (DNS-rebinding guard); add yours with CURIO_HOST.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports: ["${CURIO_HOST:-127.0.0.1}:${CURIO_PORT:-8000}:8000"]
    volumes: [demo-data:/app/data:ro]
    depends_on:
      demo-data: { condition: service_completed_successfully }
      # Only with `--profile ollama`: wait until the local model is pulled.
      ollama-pull: { condition: service_completed_successfully, required: false }
    healthcheck:
      test: ["CMD", "python", "-m", "curio.app.healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Optional local LLM for the demo: `docker compose --profile demo --profile ollama up`,
  # with LLM_PROVIDER=openai, LLM_BASE_URL=http://ollama:11434/v1, LLM_API_KEY=ollama and
  # LLM_MODEL=<a tool-calling model, e.g. qwen2.5:3b> in .env. `ollama-pull` fetches LLM_MODEL.
  ollama:
    image: ollama/ollama:0.40.6
    profiles: [ollama]
    volumes: [ollama-models:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      timeout: 3s
      retries: 40

  ollama-pull:
    image: ollama/ollama:0.40.6
    profiles: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${LLM_MODEL:-qwen2.5:3b}"]
    depends_on:
      ollama: { condition: service_healthy }

  # --- Full stack (profile: fashion) -------------------------------------------------------
  # Needs the prepared H&M data in ./data and an image index (docs/technical-guide.md).
  qdrant:
    image: qdrant/qdrant:v1.19.2   # keep in step with the qdrant-client minor version
    profiles: [fashion]
    # No `ports`: Qdrant has no API key here, so it stays on the compose network, where only
    # the API reaches it. Debug it with `docker compose exec` or a temporary 127.0.0.1 port.
    volumes: [qdrant-data:/qdrant/storage]

  # The API and the app on http://localhost:8000.
  api:
    <<: *curio
    build: .
    profiles: [fashion]
    environment:
      QDRANT_URL: http://qdrant:6333
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports: ["${CURIO_HOST:-127.0.0.1}:${CURIO_PORT:-8000}:8000"]
    volumes:
      - ./data:/app/data:ro
      - hf-cache:/home/app/.cache/huggingface
    depends_on: [qdrant]

  # One-off job: downloads the pinned recipe CSV and writes data/cocktails.parquet for the
  # full stack. The API mounts data read-only, so this service mounts it writable instead:
  #   docker compose run --rm --user "$(id -u):$(id -g)" prepare-cocktails
  #   docker compose --profile fashion restart api
  prepare-cocktails:
    <<: *curio
    profiles: [tools]   # not started by `up`
    command: ["python", "-m", "scripts.prepare_cocktails"]
    volumes:
      - ./data:/app/data

  # The same for the book catalog (goodbooks-10k):
  #   docker compose run --rm --user "$(id -u):$(id -g)" prepare-books
  prepare-books:
    <<: *curio
    profiles: [tools]
    command: ["python", "-m", "scripts.prepare_books"]
    volumes:
      - ./data:/app/data

volumes:
  demo-data:
  ollama-models:
  qdrant-data:
  hf-cache:
